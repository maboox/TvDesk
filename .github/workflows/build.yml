name: Build TvDesk

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download yt-dlp (bundled; the app keeps it updated afterwards)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: >
          dotnet publish src/TvDesk.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -o publish/TvDesk

      - name: Check output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/TvDesk/TvDesk.exe)) { throw "TvDesk.exe missing" }
          if (-not (Test-Path publish/TvDesk/libvlc)) { throw "libvlc folder missing" }
          if (-not (Test-Path publish/TvDesk/yt-dlp.exe)) { throw "yt-dlp.exe missing" }
          "Size: {0:N0} MB" -f ((Get-ChildItem publish/TvDesk -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvDesk-win-x64
          path: publish/TvDesk
          retention-days: 14

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path publish/TvDesk -DestinationPath TvDesk-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TvDesk-win-x64.zip
          generate_release_notes: true
