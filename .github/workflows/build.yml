name: Build TvDesk

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download yt-dlp
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"

      - name: Restore
        run: dotnet restore src/TvDesk.csproj

      - name: Publish recommended folder build
        run: >
          dotnet publish src/TvDesk.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=false -o publish

      - name: Zip recommended folder build
        run: Compress-Archive -Path publish/* -DestinationPath TvDesk-win-x64.zip

      - name: Publish experimental single EXE build
        run: >
          dotnet publish src/TvDesk.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish-single

      - name: Zip single EXE build
        run: Compress-Archive -Path publish-single/TvDesk.exe -DestinationPath TvDesk-single-exe-win-x64.zip

      - name: Upload recommended folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvDesk-win-x64
          path: TvDesk-win-x64.zip

      - name: Upload single EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvDesk-single-exe-win-x64
          path: TvDesk-single-exe-win-x64.zip

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TvDesk-win-x64.zip
            TvDesk-single-exe-win-x64.zip
