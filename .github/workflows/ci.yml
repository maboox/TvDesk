name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore tests/TvDesk.Tests.csproj --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1900'
      - name: Build
        run: dotnet build tests/TvDesk.Tests.csproj -c Release --no-restore -warnaserror
      - name: Security and regression tests, bilingual WPF renders
        run: dotnet run --project tests/TvDesk.Tests.csproj -c Release --no-build -- --render artifacts/preview
      - name: Publish verified portable application
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Package with checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/TvDesk -DestinationPath TvDesk-win-x64.zip
          $hash = (Get-FileHash TvDesk-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TvDesk-win-x64.zip" | Set-Content TvDesk-win-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TvDesk-win-x64
          path: |
            TvDesk-win-x64.zip
            TvDesk-win-x64.zip.sha256
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interface-previews
          path: artifacts/preview
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Retrieve tested package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name TvDesk-win-x64
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" TvDesk-win-x64.zip TvDesk-win-x64.zip.sha256 --repo ${{ github.repository }} --verify-tag --generate-notes --title "TvDesk $env:RELEASE_TAG"
